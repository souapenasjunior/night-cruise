<!doctype html>
<html lang="pt-BR">
<body style="margin:0;background:#070912;color:#eceff7;font-family:Arial,Helvetica,sans-serif">
  <div style="max-width:520px;margin:0 auto;padding:36px 28px">
    <div style="font:900 30px/1 Arial Narrow,Arial,sans-serif;letter-spacing:1px">NIGHT CRUISE</div>
    <div style="height:2px;width:64px;background:#ffb23f;margin:14px 0 26px"></div>
    <p style="font-size:16px;line-height:1.5">Confirme a troca do e-mail da sua conta para <b>{{ .NewEmail }}</b>.</p>
    <p style="margin:28px 0"><a href="{{ .ConfirmationURL }}" style="background:#ffb23f;color:#1a1204;text-decoration:none;font-weight:bold;letter-spacing:1px;padding:13px 22px;display:inline-block">CONFIRMAR TROCA</a></p>
    <p style="font-size:13px;color:#8d95ad;line-height:1.5">Se não foi você, ignore este e-mail e troque sua senha.</p>
    <p style="font-size:13px;color:#8d95ad;line-height:1.5">Confirm the new e-mail address for your Night Cruise account. If it wasn't you, ignore this and change your password.</p>
  </div>
</body>
</html>
